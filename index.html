<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caseboard — ไทม์ไลน์สืบสวน</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif;color:#e9edf5;background:#0c1220}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#111b2c;border-bottom:1px solid #28354b;position:sticky;top:0;z-index:3}.head{max-width:1200px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:800}.brand span{color:#7dd3fc}.sub{font-size:12px;color:#9caec5}.shell{max-width:1200px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.hero h1{margin:0;font-size:25px}.muted{color:#9baec8}.btn{border:1px solid #40516a;border-radius:11px;background:#223148;color:#f2f6ff;padding:10px 13px}.btn.primary{background:#38bdf8;border-color:#38bdf8;color:#061423;font-weight:750}.btn.danger{color:#ffb6b6}.btn.small{padding:5px 9px;font-size:13px}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;margin-top:18px}.panel{background:#152134;border:1px solid #293b55;border-radius:17px;padding:17px;margin-bottom:16px;min-width:0}.panel h2{font-size:17px;margin:0 0 14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:10px}label{display:block;font-size:12px;color:#b7c7db;margin-bottom:5px}input,select,textarea{width:100%;background:#0d1728;border:1px solid #344660;border-radius:9px;padding:10px;color:#f2f6ff;min-width:0}textarea{resize:vertical;min-height:78px}.field{flex:1;min-width:110px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #42516a;border-radius:30px;background:#202d41;color:#dce8fa;padding:6px 10px;font-size:13px}.chip.active{background:#164e63;border-color:#38bdf8;color:#b5f1ff}.tabs{display:flex;gap:7px;overflow:auto;padding:0 0 12px}.tab{white-space:nowrap;background:transparent;border:1px solid #34445b;color:#b6c8df;padding:11px 14px;border-radius:11px}.tab.active{background:#263b54;color:#fff;border-color:#7dd3fc}.event{border-left:3px solid #64748b;background:#101b2d;padding:13px 15px;margin:11px 0;border-radius:0 12px 12px 0}.event.confirmed{border-color:#34d399}.event.testimony{border-color:#fbbf24}.event.inference{border-color:#a78bfa}.event.suspect{border-color:#fb7185}.event h3{font-size:15px;margin:0 0 7px}.event p{margin:7px 0;color:#cbd5e1}.tag{font-size:11px;padding:3px 8px;border-radius:8px;background:#283a50;color:#dbeafe;display:inline-block;margin:2px}.status{font-size:12px;color:#a5bad3}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:540px}th,td{border-bottom:1px solid #334155;padding:10px;text-align:left;vertical-align:top}th{color:#9db6d0;background:#1c2b40}td button{font-size:12px}.notice{padding:12px;border:1px solid #40546e;border-radius:10px;margin:8px 0;background:#192b41}.empty{padding:25px;text-align:center;color:#9fb0c8}.check{display:flex;gap:8px;align-items:center;padding:5px 0}.check input{width:auto}.hidden{display:none!important}.pill{border-radius:8px;padding:4px 8px;background:#30425c;font-size:12px}.good{color:#6ee7b7}.bad{color:#fda4af}.warn{color:#fcd34d}.card{background:#101b2d;padding:12px;border-radius:12px;margin:9px 0}.compact{font-size:12px}.actions{display:flex;gap:6px;justify-content:flex-end}.number{font-size:25px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.summary>div{background:#17263b;border:1px solid #34445b;border-radius:12px;padding:12px}.mobilebar{display:none}@media(max-width:800px){.layout{display:block}.shell{padding:12px}.panel{padding:14px}.hero h1{font-size:21px}.summary{gap:6px}.summary>div{padding:10px}.mobilebar{display:block}.sidebar.collapsed{display:none}.head{padding:11px 13px}}
</style></head><body><header><div class="head"><div><div class="brand">CASE<span>BOARD</span> <span style="font-size:12px;color:#9fb5d0">TH</span></div><div class="sub">กระดานสืบสวน Murder Mystery</div></div><div class="row"><button class="btn small" onclick="exportText()">คัดลอกสรุป</button><button class="btn small" onclick="exportJSON()">บันทึก JSON</button><button class="btn small" onclick="document.getElementById('file').click()">นำเข้า</button><input id="file" type="file" accept=".json,application/json" class="hidden" onchange="importJSON(event)"></div></div></header><main class="shell"><div class="hero"><div><h1>ไทม์ไลน์สืบสวน</h1><div class="muted compact">จัดระเบียบเหตุการณ์ • ตรวจสอบอาลิบาย • วิเคราะห์ผู้ต้องสงสัย</div></div><div class="row"><button class="btn mobilebar" onclick="document.querySelector('.sidebar').classList.toggle('collapsed')">ตั้งค่าคดี / เพิ่มเหตุการณ์</button><button class="btn danger" onclick="resetAll()">ล้างข้อมูล</button></div></div><div class="layout"><aside class="sidebar"><section class="panel"><h2>วันในคดี</h2><div id="daysList" class="stack"></div><div class="row" style="margin-top:9px"><input id="newDay" placeholder="ชื่อวัน เช่น วันเกิดเหตุ"><button class="btn" onclick="addDay()">เพิ่ม</button></div></section><section class="panel"><h2>ตัวละคร</h2><div id="charactersList" class="stack"></div><div class="row" style="margin-top:9px"><input id="newChar" placeholder="ชื่อตัวละคร"><button class="btn" onclick="addChar()">เพิ่ม</button></div></section><section class="panel"><h2 id="formTitle">เพิ่มเหตุการณ์</h2><form id="eventForm" class="stack"><div><label>วัน</label><select id="evDay" required></select></div><div class="split"><div><label>เริ่มเวลา</label><input id="evStart" type="time" required value="20:00"></div><div><label>สิ้นสุด (ไม่บังคับ)</label><input id="evEnd" type="time"></div></div><div><label>สถานที่</label><input id="evPlace" placeholder="เช่น ห้องเก็บเอกสาร"></div><div><label>ตัวละครที่เกี่ยวข้อง</label><div id="evChars" class="chips"></div></div><div><label>รายละเอียด</label><textarea id="evNote" required placeholder="เกิดอะไรขึ้น และรู้ได้อย่างไร"></textarea></div><div><label>ความน่าเชื่อถือ</label><select id="evCert"><option value="confirmed">ยืนยันแล้ว (มีหลักฐาน)</option><option value="testimony">คำให้การ</option><option value="inference">ข้อสันนิษฐาน</option><option value="suspect">สงสัยว่าโกหก</option></select></div><div class="row"><button class="btn primary" type="submit" id="saveEvent">บันทึกเหตุการณ์</button><button class="btn" type="button" onclick="cancelEdit()">ยกเลิก</button></div></form></section></aside><div><div class="summary"><div><div class="muted compact">เหตุการณ์</div><div class="number" id="countEvents">0</div></div><div><div class="muted compact">ตัวละคร</div><div class="number" id="countChars">0</div></div><div><div class="muted compact">ข้อควรตรวจสอบ</div><div class="number" id="countAlerts">0</div></div></div><div class="tabs"><button class="tab active" data-tab="timeline" onclick="tab('timeline')">ไทม์ไลน์</button><button class="tab" data-tab="alibi" onclick="tab('alibi')">ตารางอาลิบาย</button><button class="tab" data-tab="notes" onclick="tab('notes')">บันทึกการสืบสวน</button><button class="tab" data-tab="checks" onclick="tab('checks')">ตรวจสอบข้อขัดแย้ง</button></div><section class="panel" id="view"></section></div></div></main><script>
const KEY='caseboard-th-v1';const sample={days:['วันก่อนเกิดเหตุ','วันเกิดเหตุ'],characters:['พ่อบ้าน','ทายาท','แพทย์','จิตรกร'],events:[{id:1,day:0,start:'22:00',end:'',place:'ตู้ยา',chars:['แพทย์'],note:'พบว่ายานอนหลับหายไปหนึ่งขวด (หลักฐานจากบัญชีตรวจนับ)',cert:'confirmed'},{id:2,day:0,start:'23:30',end:'00:30',place:'เรือนกระจก',chars:['จิตรกร','ทายาท'],note:'จิตรกรให้การว่าทั้งสองคุยกัน',cert:'testimony'},{id:3,day:1,start:'00:00',end:'',place:'ห้องส่วนตัว',chars:['ทายาท'],note:'เจ้าตัวอ้างว่าเข้านอนแล้ว',cert:'suspect'},{id:4,day:1,start:'20:00',end:'21:00',place:'ห้องอาหาร',chars:['พ่อบ้าน','ทายาท','แพทย์','จิตรกร'],note:'ทุกคนร่วมรับประทานอาหาร',cert:'confirmed'},{id:5,day:1,start:'21:00',end:'22:00',place:'ห้องครัว',chars:['พ่อบ้าน'],note:'ล้างจานหลังอาหาร มีบันทึกจำนวนภาชนะ',cert:'confirmed'},{id:6,day:1,start:'21:10',end:'',place:'ห้องทำงาน',chars:['ทายาท'],note:'พ่อบ้านได้ยินเสียงทะเลาะกับผู้ตาย',cert:'testimony'},{id:7,day:1,start:'21:15',end:'21:45',place:'ห้องส่วนตัว',chars:['แพทย์'],note:'เจ้าตัวอ้างว่าอ่านหนังสือ',cert:'suspect'},{id:8,day:1,start:'21:20',end:'21:40',place:'ห้องวาดภาพ',chars:['จิตรกร'],note:'สีบนภาพยังไม่แห้ง',cert:'inference'},{id:9,day:1,start:'21:25',end:'21:35',place:'ทางเดิน',chars:['ทายาท'],note:'อ้างว่ากำลังกลับห้อง',cert:'testimony'},{id:10,day:1,start:'21:30',end:'',place:'ทางเดิน',chars:['แพทย์'],note:'มีคนเห็นเงาคนเดินไปทางห้องทำงาน',cert:'testimony'},{id:11,day:1,start:'22:00',end:'',place:'ห้องทำงาน',chars:['ทายาท','พ่อบ้าน'],note:'พบศพ',cert:'confirmed'}],crime:{day:1,start:'21:00',end:'22:00'},gap:60,criteria:[{id:1,name:'มีแรงจูงใจ',type:'score',marks:{}},{id:2,name:'เข้าถึงอาวุธได้',type:'required',marks:{}}],notes:{},questions:[]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(sample)}catch{state=structuredClone(sample)};let current='timeline',dayFilter='all',charFilter='all',editing=null,selectedChars=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function mins(t){let [h,m]=(t||'00:00').split(':').map(Number);return h*60+m}function start(e){return e.day*1440+mins(e.start)}function end(e){if(!e.end)return start(e)+1;let x=e.day*1440+mins(e.end);return x<=start(e)?x+1440:x}function stamp(x){let d=Math.floor(x/1440),m=((x%1440)+1440)%1440;return `${state.days[d]||'วันที่ '+(d+1)} ${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`}function overlaps(a,b){return Math.max(start(a),start(b))<Math.min(end(a),end(b))}const certName={confirmed:'ยืนยันแล้ว',testimony:'คำให้การ',inference:'ข้อสันนิษฐาน',suspect:'สงสัยว่าโกหก'};function sortEvents(){return [...state.events].sort((a,b)=>start(a)-start(b))}function conflictList(){let arr=[];for(let i=0;i<state.events.length;i++)for(let j=i+1;j<state.events.length;j++){let a=state.events[i],b=state.events[j];if(!overlaps(a,b)||!a.place||!b.place)continue;let common=a.chars.filter(c=>b.chars.includes(c));if(a.place!==b.place&&common.length)arr.push({a,b,who:common,mutual:a.chars.length>1||b.chars.length>1});}return arr}function contactList(){let arr=[];for(let i=0;i<state.events.length;i++)for(let j=i+1;j<state.events.length;j++){let a=state.events[i],b=state.events[j];if(a.place&&a.place===b.place&&overlaps(a,b)&&a.chars.length&&b.chars.length&&a.chars.some(c=>!b.chars.includes(c))&&b.chars.some(c=>!a.chars.includes(c)))arr.push({a,b});}return arr}function gaps(){let arr=[];for(let d=0;d<state.days.length;d++)for(let c of state.characters){let ranges=state.events.filter(e=>e.chars.includes(c)&&start(e)<(d+1)*1440&&end(e)>d*1440).map(e=>[Math.max(start(e),d*1440),Math.min(end(e),(d+1)*1440)]).sort((a,b)=>a[0]-b[0]);let until=null;for(let [s,e] of ranges){if(until!==null&&s-until>=state.gap)arr.push({c,from:until,to:s});until=Math.max(until??e,e)}}return arr}function alibi(c){let from=state.crime.day*1440+mins(state.crime.start),to=state.crime.day*1440+mins(state.crime.end);if(to<=from)to+=1440;let ev=state.events.filter(e=>e.chars.includes(c)&&end(e)>from&&start(e)<to);let trusted=ev.filter(e=>e.cert==='confirmed').map(e=>[Math.max(from,start(e)),Math.min(to,end(e))]).sort((a,b)=>a[0]-b[0]);let covered=from;for(let [a,b] of trusted){if(a>covered)break;covered=Math.max(covered,b)}return {status:covered>=to?'มีอาลิบาย':ev.some(e=>e.cert!=='suspect')?'หลักฐานไม่เพียงพอ':'ไม่มีอาลิบาย',ev}}function renderSidebar(){$('daysList').innerHTML=state.days.map((d,i)=>`<div class="row"><input aria-label="ชื่อวัน" value="${esc(d)}" onchange="renameDay(${i},this.value)"><button class="btn small danger" onclick="removeDay(${i})">×</button></div>`).join('');$('charactersList').innerHTML=state.characters.map((c,i)=>`<div class="row"><input aria-label="ชื่อตัวละคร" value="${esc(c)}" onchange="renameChar(${i},this.value)"><button class="btn small danger" onclick="removeChar(${i})">×</button></div>`).join('');$('evDay').innerHTML=state.days.map((d,i)=>`<option value="${i}">${esc(d)}</option>`).join('');$('evChars').innerHTML=state.characters.map(c=>`<button type="button" class="chip ${selectedChars.includes(c)?'active':''}" onclick="toggleChar('${encodeURIComponent(c)}')">${esc(c)}</button>`).join('')}function render(){renderSidebar();$('countEvents').textContent=state.events.length;$('countChars').textContent=state.characters.length;$('countAlerts').textContent=conflictList().length;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===current));({timeline:renderTimeline,alibi:renderAlibi,notes:renderNotes,checks:renderChecks})[current]()}function tab(t){current=t;render()}function toggleChar(v){let c=decodeURIComponent(v);selectedChars=selectedChars.includes(c)?selectedChars.filter(x=>x!==c):[...selectedChars,c];renderSidebar()}function addDay(){let v=$('newDay').value.trim();if(!v)return;state.days.push(v);$('newDay').value='';save()}function renameDay(i,v){if(v.trim()){state.days[i]=v.trim();save()}}function removeDay(i){if(state.days.length===1)return alert('ต้องมีอย่างน้อยหนึ่งวัน');if(!confirm('ลบวันนี้และเหตุการณ์ทั้งหมดของวันนี้?'))return;state.days.splice(i,1);state.events=state.events.filter(e=>e.day!==i).map(e=>({...e,day:e.day>i?e.day-1:e.day}));state.crime.day=Math.min(state.crime.day,state.days.length-1);dayFilter='all';save()}function addChar(){let v=$('newChar').value.trim();if(!v||state.characters.includes(v))return;state.characters.push(v);$('newChar').value='';save()}function renameChar(i,v){v=v.trim();if(!v||state.characters.some((x,j)=>j!==i&&x===v))return;let old=state.characters[i];state.characters[i]=v;state.events.forEach(e=>e.chars=e.chars.map(c=>c===old?v:c));state.notes[v]=state.notes[old]||'';delete state.notes[old];state.criteria.forEach(k=>{k.marks[v]=k.marks[old]||'?';delete k.marks[old]});save()}function removeChar(i){let c=state.characters[i];if(!confirm(`ลบ ${c} ออกจากคดี?`))return;state.characters.splice(i,1);state.events.forEach(e=>e.chars=e.chars.filter(x=>x!==c));delete state.notes[c];save()}$('eventForm').onsubmit=e=>{e.preventDefault();let obj={id:editing??Date.now(),day:+$('evDay').value,start:$('evStart').value,end:$('evEnd').value,place:$('evPlace').value.trim(),chars:[...selectedChars],note:$('evNote').value.trim(),cert:$('evCert').value};if(editing!==null)state.events=state.events.map(x=>x.id===editing?obj:x);else state.events.push(obj);cancelEdit();save()};function editEvent(id){let e=state.events.find(e=>e.id===id);if(!e)return;editing=id;selectedChars=[...e.chars];renderSidebar();$('evDay').value=e.day;$('evStart').value=e.start;$('evEnd').value=e.end;$('evPlace').value=e.place;$('evNote').value=e.note;$('evCert').value=e.cert;$('formTitle').textContent='แก้ไขเหตุการณ์';$('saveEvent').textContent='บันทึกการแก้ไข';document.querySelector('.sidebar').classList.remove('collapsed');window.scrollTo({top:0,behavior:'smooth'})}function cancelEdit(){editing=null;selectedChars=[];$('eventForm').reset();$('evStart').value='20:00';$('formTitle').textContent='เพิ่มเหตุการณ์';$('saveEvent').textContent='บันทึกเหตุการณ์';renderSidebar()}function deleteEvent(id){if(confirm('ลบเหตุการณ์นี้?')){state.events=state.events.filter(e=>e.id!==id);save()}}function renderTimeline(){let e=sortEvents().filter(x=>(dayFilter==='all'||x.day===+dayFilter)&&(charFilter==='all'||x.chars.includes(charFilter)));$('view').innerHTML=`<h2>ลำดับเหตุการณ์</h2><div class="tools"><select style="max-width:220px" onchange="dayFilter=this.value;render()"><option value="all">ทุกวัน</option>${state.days.map((d,i)=>`<option value="${i}" ${String(dayFilter)===String(i)?'selected':''}>${esc(d)}</option>`).join('')}</select><select style="max-width:220px" onchange="charFilter=this.value;render()"><option value="all">ทุกคน</option>${state.characters.map(c=>`<option ${charFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${e.length?e.map(x=>`<article class="event ${x.cert}"><div class="row" style="justify-content:space-between"><h3>${esc(stamp(start(x)))}${x.end?' – '+esc(stamp(end(x))):''}</h3><span class="pill">${certName[x.cert]}</span></div><div class="status">📍 ${esc(x.place||'ไม่ระบุสถานที่')}</div><div>${x.chars.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div><p>${esc(x.note)}</p><div class="actions"><button class="btn small" onclick="editEvent(${x.id})">แก้ไข</button><button class="btn small danger" onclick="deleteEvent(${x.id})">ลบ</button></div></article>`).join(''):'<div class="empty">ยังไม่มีเหตุการณ์ในตัวกรองนี้</div>'}`}
function renderAlibi(){let times=[...new Set(state.events.flatMap(e=>[start(e),...(e.end?[end(e)]:[])]))].sort((a,b)=>a-b);let rows=times.filter(t=>Math.floor(t/1440)===+state.crime.day);$('view').innerHTML=`<h2>ตารางอาลิบาย</h2><div class="muted compact">แสดงบันทึกของแต่ละคนตามช่วงเวลา • สีระบุระดับความน่าเชื่อถือ</div><div class="tools" style="margin-top:12px"><select style="max-width:210px" onchange="state.crime.day=+this.value;save()">${state.days.map((d,i)=>`<option value="${i}" ${i===state.crime.day?'selected':''}>${esc(d)}</option>`).join('')}</select><div class="field"><label>คาดว่าเริ่มก่อเหตุ</label><input type="time" value="${state.crime.start}" onchange="state.crime.start=this.value;save()"></div><div class="field"><label>คาดว่าสิ้นสุด</label><input type="time" value="${state.crime.end}" onchange="state.crime.end=this.value;save()"></div></div><div class="tablewrap"><table><thead><tr><th>เวลา</th>${state.characters.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((t,i)=>`<tr><th>${esc(stamp(t))}</th>${state.characters.map(c=>{let active=state.events.filter(e=>e.chars.includes(c)&&start(e)<=t&&end(e)>t);return `<td>${active.map(e=>`<span class="tag" title="${esc(e.note)}">${esc(e.place||'ไม่ระบุ')} · ${certName[e.cert]}</span>`).join('')||'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><h2 style="margin-top:20px">อาลิบายในช่วงเกิดเหตุ</h2>${state.characters.map(c=>{let a=alibi(c);return `<div class="notice"><b>${esc(c)}</b> — <span class="${a.status==='มีอาลิบาย'?'good':a.status==='ไม่มีอาลิบาย'?'bad':'warn'}">${a.status}</span><div class="compact muted">${a.ev.length} บันทึกที่เกี่ยวข้อง</div></div>`}).join('')}<p class="compact muted">หมายเหตุ: ระบบถือว่ามีอาลิบายเมื่อหลักฐานที่ยืนยันแล้วครอบคลุมช่วงเกิดเหตุทั้งหมดเท่านั้น ไม่ใช่การตัดสินว่าบริสุทธิ์</p>`}
function renderChecks(){let cf=conflictList(),ct=contactList(),gp=gaps();$('view').innerHTML=`<h2>ตรวจสอบข้อขัดแย้ง</h2><div class="row" style="margin-bottom:14px"><label style="margin:0">แจ้งเตือนช่องว่างตั้งแต่</label><select style="max-width:140px" onchange="state.gap=+this.value;save()">${[30,45,60,90,120].map(n=>`<option value="${n}" ${state.gap===n?'selected':''}>${n} นาที</option>`).join('')}</select></div><h2 class="bad">สถานที่ขัดแย้ง (${cf.length})</h2>${cf.length?cf.map(x=>`<div class="notice"><b>${esc(x.who.join(', '))}</b> ${x.mutual?'· อาลิบายร่วมขัดแย้ง':''}<div class="compact">${esc(x.a.place)} ↔ ${esc(x.b.place)}</div><div class="muted compact">${esc(stamp(Math.max(start(x.a),start(x.b))))} • เหตุการณ์ #${x.a.id} / #${x.b.id}</div></div>`).join(''):'<p class="muted">ไม่พบสถานที่ขัดแย้ง</p>'}<h2 style="margin-top:22px">อาจพบกัน (${ct.length})</h2>${ct.length?ct.map(x=>`<div class="notice"><b>${esc(x.a.place)}</b> · ${esc(stamp(Math.max(start(x.a),start(x.b))))}<div class="compact">${esc(x.a.chars.join(', '))} / ${esc(x.b.chars.join(', '))}</div></div>`).join(''):'<p class="muted">ไม่พบการพบกันจากคนละบันทึก</p>'}<h2 style="margin-top:22px">ช่วงเวลาที่ไม่มีข้อมูล (${gp.length})</h2>${gp.length?gp.map(x=>`<div class="notice"><b>${esc(x.c)}</b> · ${Math.round((x.to-x.from))} นาที<div class="muted compact">${esc(stamp(x.from))} – ${esc(stamp(x.to))}</div></div>`).join(''):'<p class="muted">ไม่พบช่องว่างตามเกณฑ์</p>'}<p class="compact muted">ช่วงเวลาที่สิ้นสุดตรงกับเวลาเริ่มอีกเหตุการณ์จะไม่ถือว่าทับซ้อนกัน และบันทึกที่ไม่มีเวลาสิ้นสุดนับเป็นเหตุการณ์ ณ จุดเวลานั้น</p>`}
function mark(c,id){let k=state.criteria.find(k=>k.id===id);let x=k.marks[c]||'?';k.marks[c]=x==='?'?'○':x==='○'?'×':'?';save()}function renderNotes(){let ranked=state.characters.map(c=>{let excluded=state.criteria.some(k=>k.type==='required'&&k.marks[c]==='×');let score=state.criteria.filter(k=>k.type==='score'&&k.marks[c]==='○').length;return {c,excluded,score}}).sort((a,b)=>a.excluded-b.excluded||b.score-a.score);$('view').innerHTML=`<h2>บันทึกการสืบสวน</h2><h3>เงื่อนไขคัดกรองผู้ต้องสงสัย</h3><div class="row"><input id="criterionName" placeholder="เช่น รู้ตำแหน่งอาวุธ"><select id="criterionType" style="max-width:120px"><option value="required">จำเป็น</option><option value="score">เพิ่มคะแนน</option></select><button class="btn" onclick="addCriterion()">เพิ่มเงื่อนไข</button></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>เงื่อนไข</th>${state.characters.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>${state.criteria.map(k=>`<tr><td>${esc(k.name)}<div class="muted compact">${k.type==='required'?'จำเป็น':'เพิ่มคะแนน'}</div></td>${state.characters.map(c=>`<td><button class="btn small" onclick="mark(decodeURIComponent('${encodeURIComponent(c)}'),${k.id})">${esc(k.marks[c]||'?')}</button></td>`).join('')}<td><button class="btn small danger" onclick="deleteCriterion(${k.id})">×</button></td></tr>`).join('')}</tbody></table></div><div class="muted compact" style="margin:8px 0">กด ? → ○ → × เพื่อเปลี่ยนสถานะ</div><h3>ผู้ต้องสงสัยตามเงื่อนไข</h3>${ranked.map(r=>`<div class="notice"><b>${esc(r.c)}</b> · <span class="${r.excluded?'bad':'good'}">${r.excluded?'ตัดออกตามเงื่อนไขจำเป็น':'ยังเป็นไปได้'}</span><div class="compact muted">คะแนนข้อสงสัย ${r.score} · ${alibi(r.c).status}</div></div>`).join('')}<h3 style="margin-top:20px">บันทึกตัวละคร</h3>${state.characters.map(c=>`<div style="margin-bottom:10px"><label>${esc(c)}</label><textarea oninput="state.notes[decodeURIComponent('${encodeURIComponent(c)}')]=this.value;localStorage.setItem(KEY,JSON.stringify(state))" placeholder="แรงจูงใจ ความสัมพันธ์ ความลับ...">${esc(state.notes[c]||'')}</textarea></div>`).join('')}<h3>คำถามที่ยังไม่คลี่คลาย</h3><div class="row"><input id="newQuestion" placeholder="สิ่งที่ต้องหาคำตอบ"><button class="btn" onclick="addQuestion()">เพิ่ม</button></div>${state.questions.map(q=>`<div class="notice row"><input style="width:auto" type="checkbox" ${q.done?'checked':''} onchange="questionDone(${q.id},this.checked)"><span style="flex:1;${q.done?'text-decoration:line-through;opacity:.6':''}">${esc(q.text)}</span><button class="btn small danger" onclick="deleteQuestion(${q.id})">×</button></div>`).join('')}`;document.querySelectorAll('[onclick^="mark("]').forEach(el=>{let c=el.getAttribute('onclick').match(/mark\('([^']+)'/);if(c)el.setAttribute('onclick',el.getAttribute('onclick').replace(c[1],decodeURIComponent(c[1]).replace(/'/g,"\\'")))})}
function addCriterion(){let n=$('criterionName').value.trim();if(!n)return;state.criteria.push({id:Date.now(),name:n,type:$('criterionType').value,marks:{}});save()}function deleteCriterion(id){state.criteria=state.criteria.filter(k=>k.id!==id);save()}function addQuestion(){let t=$('newQuestion').value.trim();if(!t)return;state.questions.push({id:Date.now(),text:t,done:false});save()}function questionDone(id,v){state.questions.find(q=>q.id===id).done=v;save()}function deleteQuestion(id){state.questions=state.questions.filter(q=>q.id!==id);save()}function resetAll(){if(confirm('ล้างข้อมูลทั้งหมดและเริ่มคดีใหม่?')){state={days:['วันเกิดเหตุ'],characters:[],events:[],crime:{day:0,start:'20:00',end:'21:00'},gap:60,criteria:[],notes:{},questions:[]};dayFilter='all';charFilter='all';cancelEdit();save()}}function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='caseboard-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function importJSON(ev){let f=ev.target.files[0];if(!f)return;f.text().then(s=>{try{let x=JSON.parse(s);if(!Array.isArray(x.days)||!Array.isArray(x.characters)||!Array.isArray(x.events))throw Error('รูปแบบไม่ถูกต้อง');state={...structuredClone(sample),...x};state.criteria=state.criteria||[];state.questions=state.questions||[];state.notes=state.notes||{};dayFilter='all';charFilter='all';save();alert('นำเข้าข้อมูลแล้ว')}catch(e){alert('อ่านไฟล์ไม่ได้: '+e.message)}});ev.target.value=''}function exportText(){let lines=['CASEBOARD — สรุปคดี','วัน: '+state.days.join(', '),'ตัวละคร: '+state.characters.join(', '),'','เหตุการณ์',...sortEvents().map(e=>`${stamp(start(e))}${e.end?' – '+stamp(end(e)):''} | ${e.place} | ${e.chars.join(', ')} | ${certName[e.cert]} | ${e.note}`),'','อาลิบาย',...state.characters.map(c=>c+': '+alibi(c).status),'','คำถามที่ยังไม่คลี่คลาย',...state.questions.filter(q=>!q.done).map(q=>'• '+q.text)];let t=lines.join('\n');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert('คัดลอกแล้ว')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();alert('คัดลอกสรุปแล้ว')}render();
</script></body></html>
