<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murder Mystery Scenario Designer</title><style>:root{font-family:Arial,'Noto Sans Thai',sans-serif;color:#e8eaf2;background:#10131b}*{box-sizing:border-box}body{margin:0}header{padding:20px 26px;background:#191e2a;border-bottom:1px solid #343b4b;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0}small,.muted{color:#a8afc1}button,input,select,textarea{font:inherit}button{background:#30394d;color:white;border:1px solid #4b5870;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{background:#43516b}.primary{background:#6254c9}.danger{color:#ffb2b2}main{max-width:1450px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}nav button.active{background:#6254c9}.panel{background:#1b2130;border:1px solid #343e53;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:12px;color:#b8bfd0}input,select,textarea{width:100%;background:#111722;color:#f1f3fb;border:1px solid #48536a;border-radius:7px;padding:9px}textarea{min-height:75px}input[type=checkbox]{width:auto}.item{border:1px solid #3a455b;border-radius:9px;padding:12px;margin:10px 0;background:#20283a}.item h3{margin:0 0 8px;font-size:16px}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#39435b;font-size:12px;margin:3px}.hidden{display:none}.split{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:16px}@media(max-width:850px){.split{grid-template-columns:1fr}}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:9px;border-bottom:1px solid #3b4559;text-align:left;vertical-align:top}th{color:#c3c9d8;background:#252e40}tr:hover td{background:#222b3d}.notice{padding:12px;border-left:3px solid #e7b65c;background:#312b23;margin:9px 0}.good{border-left-color:#62caa5;background:#20362f}.count{font-size:26px;font-weight:bold}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.hint{font-size:13px;color:#aab3c8}.bar{height:9px;background:#30394b;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#8275e9} .timeline{border-left:2px solid #6860a7;margin-left:12px;padding-left:18px}.timeline .item{position:relative}.timeline .item:before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#8d80fa;left:-25px;top:15px}</style></head><body><header><div><h1>Scenario Designer <small> / Murder Mystery</small></h1><div class="muted">ความจริง → การรับรู้ → เบาะแส → ข้อสรุปของผู้เล่น</div></div><div class="row"><button onclick="exportJSON()">ส่งออก JSON</button><button onclick="document.getElementById('import').click()">นำเข้า JSON</button><input id="import" type="file" accept="application/json" class="hidden" onchange="importJSON(event)"><button onclick="resetData()" class="danger">ล้างข้อมูล</button></div></header><main><nav id="nav"></nav><div id="app"></div></main><script>
const KEY='mm_author_designer_v1';const blank=()=>({characters:[],events:[],clues:[],deductions:[]});let db=load(),tab='timeline',editing=null;function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY))}}catch{return blank()}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function id(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function names(ids){return (ids||[]).map(x=>db.characters.find(c=>c.id===x)?.name||'?').join(', ')||'—'}function evName(id){let e=db.events.find(x=>x.id===id);return e?`${e.day||'วันเกิดเหตุ'} ${e.time||'ไม่ระบุเวลา'} · ${e.title}`:'—'}function clueName(id){return db.clues.find(x=>x.id===id)?.title||'—'}function opts(arr,selected,placeholder='เลือก'){return `<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${esc(x.id)}" ${selected===x.id?'selected':''}>${esc(x.name||x.title)}</option>`).join('')}function checks(arr,selected=[],prefix='p'){return arr.map(x=>`<label class="pill"><input type="checkbox" name="${prefix}" value="${esc(x.id)}" ${(selected||[]).includes(x.id)?'checked':''}> ${esc(x.name||x.title)}</label>`).join('')||'<span class="hint">เพิ่มตัวละครก่อน</span>'}function checked(form,name){return [...form.querySelectorAll(`[name="${name}"]:checked`)].map(x=>x.value)}function field(label,name,value='',type='text'){return `<div class="field"><label>${label}</label><input type="${type}" name="${name}" value="${esc(value)}"></div>`}function area(label,name,value=''){return `<div class="field"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`}function section(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}const tabs=[['timeline','Master Timeline'],['characters','ตัวละคร'],['clues','เบาะแสและการแจกข้อมูล'],['deductions','Deduction Map'],['matrix','เมทริกซ์ข้อมูล'],['validate','ตรวจสอบบท']];function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');document.getElementById('app').innerHTML=({timeline:renderTimeline,characters:renderCharacters,clues:renderClues,deductions:renderDeductions,matrix:renderMatrix,validate:renderValidate}[tab])()}function go(t){tab=t;editing=null;render()}function edit(type,key){tab=type;editing=key;render();window.scrollTo(0,0)}function remove(type,key){if(!confirm('ลบรายการนี้?'))return;db[type]=db[type].filter(x=>x.id!==key);if(type==='characters'){db.events.forEach(e=>e.people=e.people.filter(p=>p!==key));db.clues.forEach(c=>c.distribution=c.distribution.filter(d=>d.character!==key))}save()}function formSave(type,fn){const f=document.getElementById('editor');const data=fn(f);if(!data.title&&!data.name){alert('กรุณาระบุชื่อ');return}if(editing){db[type]=db[type].map(x=>x.id===editing?{...x,...data}:x)}else db[type].push({id:id(),...data});editing=null;save()}function cancel(){editing=null;render()}
function renderCharacters(){let x=db.characters.find(a=>a.id===editing)||{};return `<div class="split"><div>${section(editing?'แก้ไขตัวละคร':'เพิ่มตัวละคร',`<form id="editor" onsubmit="event.preventDefault();formSave('characters',f=>({name:f.name.value,role:f.role.value,secret:f.secret.value,goal:f.goal.value}))"><div class="grid">${field('ชื่อตัวละคร','name',x.name)}${field('บทบาท','role',x.role)}</div>${area('ความลับ / ข้อเท็จจริงที่รู้','secret',x.secret)}${area('เป้าหมายส่วนตัว','goal',x.goal)}<div class="actions"><button class="primary">บันทึก</button><button type="button" onclick="cancel()">ยกเลิก</button></div></form>`)}</div><div>${section(`ตัวละคร (${db.characters.length})`,db.characters.map(c=>`<div class="item"><h3>${esc(c.name)} <small>${esc(c.role)}</small></h3><div class="hint">เป้าหมาย: ${esc(c.goal||'—')}</div><div class="actions"><button onclick="edit('characters','${c.id}')">แก้ไข</button><button class="danger" onclick="remove('characters','${c.id}')">ลบ</button></div></div>`).join('')||'<p class="hint">ยังไม่มีตัวละคร</p>')}</div></div>`}
function renderTimeline(){let x=db.events.find(a=>a.id===editing)||{};let events=[...db.events].sort((a,b)=>(a.day||'').localeCompare(b.day||'','th')||(a.time||'').localeCompare(b.time||''));return `<div class="split"><div>${section(editing?'แก้ไขเหตุการณ์':'สร้างเหตุการณ์',`<form id="editor" onsubmit="event.preventDefault();formSave('events',f=>({title:f.title.value,day:f.day.value,time:f.time.value,end:f.end.value,location:f.location.value,people:checked(f,'people'),truth:f.truth.value,visibility:f.visibility.value,notes:f.notes.value}))">${field('ชื่อเหตุการณ์','title',x.title)}<div class="grid">${field('วัน / ช่วงเวลา เช่น วันก่อนงาน','day',x.day||'วันก่อนงาน')}${field('เวลาเริ่ม (เวลาจริงของผู้แต่ง)','time',x.time,'time')}${field('เวลาสิ้นสุด (ถ้ามี)','end',x.end,'time')}${field('สถานที่','location',x.location)}</div><div class="field"><label>ผู้เกี่ยวข้อง</label><div>${checks(db.characters,x.people,'people')}</div></div>${area('สิ่งที่เกิดขึ้นจริง','truth',x.truth)}${area('สิ่งที่ผู้เล่นอาจเข้าใจผิด / สิ่งที่เห็นภายนอก','visibility',x.visibility)}${area('หมายเหตุผู้แต่ง','notes',x.notes)}<div class="actions"><button class="primary">บันทึก</button><button type="button" onclick="cancel()">ยกเลิก</button></div></form>`)}</div><div>${section(`เหตุการณ์จริง (${db.events.length})`,`<div class="timeline">${events.map(e=>`<div class="item"><h3>${esc(e.day||'วันเกิดเหตุ')} · ${esc(e.time||'ไม่กำหนดเวลา')} ${e.end?'– '+esc(e.end):''}</h3><strong>${esc(e.title)}</strong> <span class="pill">${esc(e.location||'ไม่ระบุสถานที่')}</span><p>${esc(e.truth||'')}</p><div class="hint">ผู้เกี่ยวข้อง: ${esc(names(e.people))}</div><div class="hint">ภาพที่ปรากฏ: ${esc(e.visibility||'—')}</div><div class="hint">เบาะแสที่เชื่อม: ${db.clues.filter(c=>c.eventId===e.id).map(c=>esc(c.title)).join(', ')||'ยังไม่มี'}</div><div class="actions"><button onclick="edit('timeline','${e.id}')">แก้ไข</button><button class="danger" onclick="remove('events','${e.id}')">ลบ</button></div></div>`).join('')||'<p class="hint">เริ่มสร้างเหตุการณ์จริงก่อน แล้วค่อยผูกเบาะแส</p>'}</div>`)}</div></div>`}
function renderClues(){let x=db.clues.find(a=>a.id===editing)||{},dist=x.distribution||[];return `<div class="split"><div>${section(editing?'แก้ไขเบาะแส':'สร้างเบาะแส',`<form id="editor" onsubmit="event.preventDefault();saveClue(this)">${field('ชื่อเบาะแส','title',x.title)}<div class="field"><label>เชื่อมกับเหตุการณ์จริง</label><select name="eventId">${opts(db.events.map(e=>({...e,name:evName(e.id)})),x.eventId)}</select></div><div class="field"><label>ประเภทเบาะแส</label><select name="kind">${['สิ่งที่เห็น','สิ่งที่ได้ยิน','วัตถุ/หลักฐาน','เอกสาร','คำให้การ','ความทรงจำ','อื่นๆ'].map(t=>`<option ${x.kind===t?'selected':''}>${t}</option>`).join('')}</select></div>${area('เนื้อหาที่ผู้เล่นจะได้รับ (ไม่จำเป็นต้องบอกเวลาจริง)','content',x.content)}${area('ความหมายที่แท้จริง / สิ่งที่พิสูจน์ได้','meaning',x.meaning)}<div class="field"><label>ความน่าเชื่อถือ</label><select name="reliability">${['จริง','จริงบางส่วน','คลาดเคลื่อน','จงใจโกหก','ยังไม่กำหนด'].map(t=>`<option ${x.reliability===t?'selected':''}>${t}</option>`).join('')}</select></div><h3>การกระจายข้อมูล</h3><p class="hint">แต่ละคนอาจได้รับข้อมูลเดียวกันต่างรูปแบบ และอาจไม่รู้เวลาที่แท้จริง</p><div id="dist">${dist.map((d,i)=>distRow(d,i)).join('')}</div><button type="button" onclick="addDist()">+ เพิ่มผู้รับข้อมูล</button><div class="actions"><button class="primary">บันทึกเบาะแส</button><button type="button" onclick="cancel()">ยกเลิก</button></div></form>`)}</div><div>${section(`เบาะแส (${db.clues.length})`,db.clues.map(c=>`<div class="item"><h3>${esc(c.title)} <span class="pill">${esc(c.kind)}</span></h3><div class="hint">เชื่อมกับ: ${esc(evName(c.eventId))}</div><p>${esc(c.content)}</p><div class="hint">ผู้รับ: ${(c.distribution||[]).map(d=>esc(db.characters.find(p=>p.id===d.character)?.name||'?')+' ('+esc(d.timing||'ไม่ระบุเวลา')+')').join(', ')||'ยังไม่แจก'}</div><div class="actions"><button onclick="edit('clues','${c.id}')">แก้ไข</button><button class="danger" onclick="remove('clues','${c.id}')">ลบ</button></div></div>`).join('')||'<p class="hint">ยังไม่มีเบาะแส</p>')}</div></div>`}
function distRow(d={},i=0){return `<div class="item distribution"><div class="field"><label>ผู้รับข้อมูล</label><select class="recipient">${opts(db.characters,d.character)}</select></div><div class="field"><label>รู้จากช่องทางใด</label><select class="channel">${['เห็นเอง','ได้ยินเอง','มีคนเล่า','อ่านเอกสาร','ได้รับหลักฐาน','ความทรงจำ','อื่นๆ'].map(t=>`<option ${d.channel===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>รู้เวลาแค่ไหน</label><select class="timing">${['ไม่รู้เวลา','รู้เวลาแน่นอน','รู้เวลาโดยประมาณ','รู้ลำดับก่อน/หลัง','เข้าใจเวลาผิด'].map(t=>`<option ${d.timing===t?'selected':''}>${t}</option>`).join('')}</select></div>${area('ข้อมูลฉบับที่ตัวละครนี้ได้รับ','version',d.version)}<button type="button" class="danger" onclick="this.closest('.distribution').remove()">ลบผู้รับ</button></div>`}function addDist(){document.getElementById('dist').insertAdjacentHTML('beforeend',distRow())}function saveClue(f){let data={title:f.title.value,eventId:f.eventId.value,kind:f.kind.value,content:f.content.value,meaning:f.meaning.value,reliability:f.reliability.value,distribution:[...f.querySelectorAll('.distribution')].map(r=>({character:r.querySelector('.recipient').value,channel:r.querySelector('.channel').value,timing:r.querySelector('.timing').value,version:r.querySelector('[name=version]').value})).filter(d=>d.character)};if(!data.title.trim()){alert('กรุณาระบุชื่อเบาะแส');return}if(editing)db.clues=db.clues.map(c=>c.id===editing?{...c,...data}:c);else db.clues.push({id:id(),...data});editing=null;save()}
function renderDeductions(){let x=db.deductions.find(a=>a.id===editing)||{};return `<div class="split"><div>${section(editing?'แก้ไขข้อสรุป':'สร้างข้อสรุปที่ต้องการให้ผู้เล่นพิสูจน์',`<form id="editor" onsubmit="event.preventDefault();formSave('deductions',f=>({title:f.title.value,answer:f.answer.value,clueIds:checked(f,'clueIds'),importance:f.importance.value}))">${field('คำถาม / ข้อสรุป','title',x.title)}${area('คำตอบที่ถูกต้อง / ตรรกะการอนุมาน','answer',x.answer)}<div class="field"><label>เบาะแสที่ต้องเชื่อมโยง</label>${checks(db.clues,x.clueIds,'clueIds')}</div><div class="field"><label>ความสำคัญ</label><select name="importance"><option ${x.importance==='จำเป็น'?'selected':''}>จำเป็น</option><option ${x.importance==='เสริม'?'selected':''}>เสริม</option></select></div><div class="actions"><button class="primary">บันทึก</button><button type="button" onclick="cancel()">ยกเลิก</button></div></form>`)}</div><div>${section(`ข้อสรุป (${db.deductions.length})`,db.deductions.map(d=>`<div class="item"><h3>${esc(d.title)} <span class="pill">${esc(d.importance)}</span></h3><p>${esc(d.answer)}</p><div class="hint">เบาะแส: ${(d.clueIds||[]).map(clueName).map(esc).join(' + ')||'ยังไม่เชื่อม'}</div><div class="actions"><button onclick="edit('deductions','${d.id}')">แก้ไข</button><button class="danger" onclick="remove('deductions','${d.id}')">ลบ</button></div></div>`).join('')||'<p class="hint">ตัวอย่าง: ผู้เล่นต้องพิสูจน์ว่าเสียงที่ได้ยินไม่ใช่เสียงขณะฆาตกรรม</p>')}</div></div>`}
function renderMatrix(){return section('เมทริกซ์การกระจายข้อมูล',`<p class="hint">แถวคือเบาะแส คอลัมน์คือตัวละคร ช่องที่มีข้อมูลแสดงวิธีรับรู้และความแม่นยำเรื่องเวลา</p><div class="scroll"><table><thead><tr><th>เบาะแส</th>${db.characters.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${db.clues.map(c=>`<tr><th>${esc(c.title)}</th>${db.characters.map(p=>{let ds=(c.distribution||[]).filter(d=>d.character===p.id);return `<td>${ds.map(d=>`<strong>${esc(d.channel)}</strong><div class="hint">${esc(d.timing)}</div><div class="hint">${esc(d.version)}</div>`).join('')||'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`)}
function renderValidate(){let issues=[];db.events.forEach(e=>{if(!e.time)issues.push(`เหตุการณ์ “${e.title}” ยังไม่กำหนดเวลาจริง`)});db.clues.forEach(c=>{if(!c.eventId)issues.push(`เบาะแส “${c.title}” ยังไม่ผูกกับเหตุการณ์`);if(!(c.distribution||[]).length)issues.push(`เบาะแส “${c.title}” ยังไม่มีผู้ได้รับข้อมูล`)});db.deductions.forEach(d=>{if(!(d.clueIds||[]).length)issues.push(`ข้อสรุป “${d.title}” ยังไม่มีเบาะแสรองรับ`)});for(let p of db.characters){let events=db.events.filter(e=>(e.people||[]).includes(p.id)&&e.time&&e.end&&e.location);for(let i=0;i<events.length;i++)for(let j=i+1;j<events.length;j++){let a=events[i],b=events[j];if(a.day===b.day&&a.location!==b.location&&a.time<b.end&&b.time<a.end)issues.push(`${p.name} อยู่สองสถานที่พร้อมกัน: “${a.title}” และ “${b.title}”`)}}return `<div class="grid">${[['ตัวละคร',db.characters.length],['เหตุการณ์',db.events.length],['เบาะแส',db.clues.length],['ข้อสรุป',db.deductions.length]].map(([t,n])=>`<div class="panel"><div class="hint">${t}</div><div class="count">${n}</div></div>`).join('')}</div>${section('ตรวจความสมบูรณ์เบื้องต้น',issues.length?issues.map(x=>`<div class="notice">${esc(x)}</div>`).join(''):`<div class="notice good">ไม่พบปัญหาจากกฎตรวจสอบเบื้องต้น</div>`)}${section('Coverage ของข้อสรุป',db.deductions.map(d=>{let n=(d.clueIds||[]).length;return `<div class="item"><strong>${esc(d.title)}</strong><div class="hint">เชื่อม ${n} เบาะแส · ${esc(d.importance)}</div><div class="bar"><span style="width:${Math.min(100,n*33)}%"></span></div></div>`}).join('')||'<p class="hint">เพิ่มข้อสรุปที่ผู้เล่นต้องพิสูจน์เพื่อดูความครอบคลุม</p>')}<p class="hint">หมายเหตุ: ระบบตรวจข้อขัดแย้งเชิงเวลาและความครบถ้วนของการเชื่อมโยงเท่านั้น ยังไม่สามารถตัดสินว่าปริศนาแก้ได้อย่างเป็นเอกลักษณ์หรือไม่</p>`}
function exportJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='murder-mystery-scenario.json';a.click();URL.revokeObjectURL(url)}async function importJSON(e){let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!['characters','events','clues','deductions'].every(k=>Array.isArray(x[k])))throw Error('รูปแบบไฟล์ไม่ถูกต้อง');if(!confirm('แทนที่ข้อมูลปัจจุบันด้วยไฟล์นี้?'))return;db=x;editing=null;save()}catch(err){alert('นำเข้าไม่สำเร็จ: '+err.message)}e.target.value=''}function resetData(){if(confirm('ลบข้อมูลทั้งหมดในโปรเจกต์นี้? โปรดส่งออก JSON สำรองก่อน')){db=blank();editing=null;save()}}render();</script></body></html>
